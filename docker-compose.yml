services:
  # REVERSE PROXY - Automatyczny SSL i Routing
  proxy:
    image: caddy:latest
    networks:
      - drone-net
    container_name: caddy_proxy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    restart: always

  # APLIKACJA ZARZĄDZAJĄCA
  drone_app:
    build: ./app
    container_name: drone_app
    networks:
      - drone-net
    ports:
      - "8080:8080"  # Lewy to VPS, prawy to KONTENER. Prawy MUSI być 8080.
    environment:
      - DOMAIN=${DOMAIN}
      - STORAGE_SECRET=${STORAGE_SECRET}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./credentials.json:/app/credentials.json # Klucz do Google Drive
      - recordings_data:/recordings
    user: "${UID:-1000}:${GID:-1000}"
    restart: always
 
  # SILNIK WIDEO - RTMP, RTSP, WebRTC, DVR
  mediamtx:
    image: bluenviron/mediamtx:latest
    networks:
      - drone-net
    container_name: mediamtx
    ports:
      - "1935:1935"      # RTMP dla dronów
      - "8554:8554"      # RTSP dla kamer IP
      - "8000:8000/udp"  # WebRTC UDP Mux
      - "8889:8889/tcp"   # WebRTC (Signaling)
      - "8888:8888/"   # HLS
      - "8889:8889/udp"   # WebRTC (Wideo - KLUCZOWE)
      - "8189:8189/udp"   # ICE (Czasem wymagane)
      - "9997:9997"
    volumes:
      - ./config/mediamtx.yml:/mediamtx.yml:ro
      - recordings_data:/recordings
    restart: always
    depends_on:
      drone_app:
        condition: service_started
networks:
  drone-net:
    driver: bridge

volumes:
  recordings_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/recordings
  caddy_data:
  caddy_config: