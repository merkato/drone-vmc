# --- KONFIGURACJA DLA v1.15.6+ ---
# Nowy sposób autoryzacji zewnętrznej
authMethod: http
authHTTPAddress: http://drone_app:8080/auth

api: yes
apiAddress: :9997

# Włączamy stabilny HLS
hls: yes
hlsAddress: :8888
hlsAlwaysRemux: yes # Ważne: remuksuje RTMP do HLS natychmiast
hlsPartDuration: 1s          # Zwiększenie stabilności części
hlsSegmentDuration: 4s       # Standardowy czas segmentu
hlsAllowOrigin: '*'          # Ważne dla iFrame

# WebRTC
webrtc: no
webrtcAddress: :8889

# Globalne ustawienia nagrywania
record: no
recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S
recordFormat: fmp4        # fMP4 jest bardziej odporne na nagłe przerwanie zasilania/połączenia
recordPartDuration: 1s
recordSegmentDuration: 1h # Nowy plik co godzinę (jeśli misja trwa bardzo długo)

paths:
  all: # To ustawienie zadziała dla każdego drona
    record: yes